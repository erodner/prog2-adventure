name: Spiel im Browser veröffentlichen

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Veröffentlichen
        run: dotnet publish Adventure.Wasm -c Release -o veroeffentlicht
      - name: Basis-URL auf den Pages-Pfad setzen
        run: |
          sed -i 's|<base href="/" />|<base href="${{ steps.pages.outputs.base_path }}/" />|g' veroeffentlicht/wwwroot/index.html
          touch veroeffentlicht/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: veroeffentlicht/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
